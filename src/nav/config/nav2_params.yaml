# Nav2 configuration for differential-drive robot (non-holonomic).
# Cartographer provides map→odom TF and /map occupancy grid (no /odom topic).
#
# Costmap params use top-level keys (global_costmap / local_costmap) — standard
# nav2_bringup style. They match no launched node name; costmap sub-nodes inherit
# them via NodeOptions copy from planner_server / controller_server.
# See CLAUDE.md "Costmap parameter loading gotcha".

# ============================================================
# BT Navigator
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom           # Cartographer only publishes TF, not /odom
    default_nav_to_pose_bt_xml: ""

# ============================================================
# Planner server — NavFn A*
# ============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

# ============================================================
# Smoother server — Simple smoother
# ============================================================
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

# ============================================================
# Controller server — MPPI for differential drive
# ============================================================
controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.9

      # non-holonomic: no lateral velocity sampling
      vy_std: 0.0

      # MPPI parameters
      time_steps: 20
      model_dt: 0.05
      batch_size: 1000
      temperature: 0.1

      # CRITICAL: must be false when costmap uses robot_radius (not footprint polygon)
      consider_footprint: false

      # Critic weights — CostCritic MUST dominate path-following critics
      critics: ["PreferForwardCritic", "GoalAngleCritic", "GoalCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "CostCritic", "ConstraintCritic"]
      PreferForwardCritic:
        plugin: "nav2_mppi_controller::PreferForwardCritic"
        weight: 5.0
      GoalAngleCritic:
        plugin: "nav2_mppi_controller::GoalAngleCritic"
        weight: 3.0
      GoalCritic:
        plugin: "nav2_mppi_controller::GoalCritic"
        weight: 5.0
      PathAlignCritic:
        plugin: "nav2_mppi_controller::PathAlignCritic"
        weight: 8.0
      PathFollowCritic:
        plugin: "nav2_mppi_controller::PathFollowCritic"
        weight: 5.0
      PathAngleCritic:
        plugin: "nav2_mppi_controller::PathAngleCritic"
        weight: 2.0
      CostCritic:
        plugin: "nav2_mppi_controller::CostCritic"
        weight: 20.0
      ConstraintCritic:
        plugin: "nav2_mppi_controller::ConstraintCritic"
        weight: 4.0

# ============================================================
# Behavior server — recovery behaviors
# ============================================================
behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "wait"]

# ============================================================
# Velocity smoother — open-loop (no /odom topic)
# ============================================================
velocity_smoother:
  ros__parameters:
    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel"
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]

# ============================================================
# Global costmap
# ============================================================
global_costmap:
  ros__parameters:
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.3
    resolution: 0.05
    track_unknown_space: true
    always_send_full_costmap: True
    rolling_window: false
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: True
      subscribe_to_updates: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        obstacle_max_range: 6.0
        raytrace_max_range: 7.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: True
      inflation_radius: 0.55
      cost_scaling_factor: 3.0

# ============================================================
# Local costmap
# ============================================================
local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.3
    resolution: 0.05
    track_unknown_space: true
    always_send_full_costmap: True
    rolling_window: true
    width: 4
    height: 4
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        obstacle_max_range: 4.0
        raytrace_max_range: 5.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: True
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
